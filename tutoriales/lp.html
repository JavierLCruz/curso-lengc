<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Increíble Landing Page</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 2.5rem; }
        p { color: #7f8c8d; font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; }
        input[type="email"] { width: 100%; padding: 12px 20px; margin-bottom: 20px; border: 2px solid #bdc3c7; border-radius: 6px; font-size: 1rem; outline: none; }
        input[type="email"]:focus { border-color: #3498db; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Lanza tu idea al mundo</h1>
    <p>Estamos construyendo algo increíble. Deja tu correo electrónico para ser el primero en enterarte del lanzamiento y recibir un beneficio exclusivo.</p>
    
    <!-- Formulario de captura -->
    <form action="#" method="POST">
        <input type="email" placeholder="Tu correo electrónico principal" required>
        <button type="submit">Unirme a la lista de espera</button>
    </form>
</div>

</body>
</html>
